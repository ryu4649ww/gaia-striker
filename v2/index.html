<title>GAIA STRIKER ―地球奪還十二戦線―</title>

.menu.show { display: flex; }

.mb small { display: block; font: 400 11px sans-serif; color: #9ab; letter-spacing: 0; margin-top: 2px; }

.grid .mb { min-width: 0; width: auto; padding: 8px 4px; font-size: 12px; }
table.hs { border-collapse: collapse; font-size: 13px; min-width: 260px; }
table.hs td { padding: 3px 6px; border-bottom: 1px solid rgba(120,180,255,0.15); }
table.hs td.r { text-align: right; font-family: "Arial Black", sans-serif; }
.tabs { display: flex; gap: 4px; }
.tabs .mb { min-width: 0; width: auto; padding: 6px 8px; font-size: 11px; }

.row .mb { min-width: 0; width: 44px; padding: 6px; }
.row .val { min-width: 70px; text-align: center; font: 700 15px "Arial Black", sans-serif; color: #ffe23c; }
.name { display: flex; gap: 10px; }
.name .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.name .ch { font: 900 34px "Arial Black", monospace; width: 46px; text-align: center; border-bottom: 3px solid #3a6ab0; }
.name .ch.cur { border-color: #ffe23c; color: #ffe23c; }
.name .mb { min-width: 0; width: 46px; padding: 4px; }
.tbtn { position: fixed; display: none; z-index: 5; width: 64px; height: 44px; border-radius: 10px; border: 2px solid rgba(160,220,255,0.6); background: rgba(10,20,50,0.55); color: #fff; font: 900 14px "Arial Black", sans-serif; touch-action: none; }

.tbtn:active { background: rgba(60,120,220,0.7); }

.tap.hide { display: none; }

.note { font-size: 11px; color: #89a; text-align: center; }
